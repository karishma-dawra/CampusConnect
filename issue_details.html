<!DOCTYPE html>
<html>

<head>
    <title>Issue Details - CampusConnect</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <header>
        <div class="brand">
            <img src="chitkaralogo.png"
                 alt="Chitkara University logo"
                 class="logo">

            <h1>Campus<span>Connect</span></h1>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="login.html" class="logout-btn">Logout</a>
        </nav>
    </header>

    <main>

        <h2>Issue Details</h2>

        <div class="issue-details-card" id="issue-details">

            <h3 id="issue-title">Issue Title</h3>

            <p>
                <strong>Category:</strong>
                <span id="issue-category">Category</span>
            </p>

            <p>
                <strong>Location:</strong>
                <span id="issue-location">Location</span>
            </p>

            <p>
                <strong>Description:</strong>
                <span id="issue-description">Description</span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="issue-status">Open</span>
            </p>

        </div>

    </main>

    <script>
        // Issue details will be loaded from the backend API.
    </script>

</body>

</html>
