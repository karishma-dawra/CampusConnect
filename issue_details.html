<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusConnect</title>
    <link
        rel="icon"
        type="image/png"
        href="https://drive.google.com/thumbnail?id=1FnXdG7aGmNNLgkQSF7leajJrgMWwGhn8&sz=w128"
    >
    <link rel="stylesheet" href="style_adv.css">
    <script src="loader.js" defer></script>
    <script src="login.js" defer></script>
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div class="spinner" id="spinner"></div>
        <img
            id="loader-logo"
            src="https://drive.google.com/thumbnail?id=1P5dhvb-RHJ_f-3v45eattSBf56D5e9yZ&sz=w1000"
            alt="Website Logo"
        >
    </div>
    <!-- End Loader -->
    <!-- Background -->
    <div class="background">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
    </div>
    <!-- Login Container -->
    <main class="login-container">
        <div class="brand">
            <div class="logo"></div>
            <h1>Campus<span>Connect</span></h1>
            <p>Connect. Collaborate. Grow.</p>
        </div>
        <div class="login-card">
            <div class="card-header">
                <h2>Welcome Back</h2>
                <p>Sign in to continue to your account</p>
            </div>
            <!-- Login Form -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Official college email"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="input-group">
                    <div class="password-label">
                        <label for="password">Password</label>
                        <a href="#" id="forgotPassword">
                            Forgot password?
                        </a>
                    </div>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit">
                    Sign In
                    <span>→</span>
                </button>
            </form>
            <!-- End Login Form -->
            <p class="register">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>
        </div>
    </main>
</body>
</html>
