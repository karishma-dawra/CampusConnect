<!DOCTYPE html>
<html>

<head>
    <title>Create Issue - CampusConnect</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <header>
        <div class="brand">
            <img src="chitkaralogo.png" alt="Chitkara university logo" class="logo">
            <h1>Campus<span>Connect</span></h1>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="login.html" class="logout-btn">Logout</a>
        </nav>
    </header>

    <main>

        <h2>Create New Issue</h2>

        <div class="issue-form">

            <label for="issueTitle">Issue Title</label>
            <input
                type="text"
                id="issueTitle"
                name="title"
                placeholder="Enter issue title"
            >

            <label for="issueCategory">Category</label>
            <select id="issueCategory" name="category">
                <option value="">Select Category</option>
                <option value="Classroom">Classroom</option>
                <option value="Campus">Campus</option>
                <option value="Lost & Found">Lost & Found</option>
                <option value="General">General</option>
            </select>

            <label for="issueLocation">Location / Room</label>
            <input
                type="text"
                id="issueLocation"
                name="location"
                placeholder="Enter location or room number"
            >

            <label for="issueDescription">Description</label>
            <textarea
                id="issueDescription"
                name="description"
                placeholder="Describe the issue"
            ></textarea>

            <button type="button" onclick="submitIssue()">Submit Issue</button>

        </div>

    </main>

    <script>
        function submitIssue() {
            alert("Issue submitted successfully!");
            window.location.href = "dashboard.html";
        }
    </script>

</body>

</html>
