<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect Dashboard</title>
     <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1FnXdG7aGmNNLgkQSF7leajJrgMWwGhn8&sz=w128">
    <link rel="stylesheet" href="dashboard.css">
    <script src="loader.js" defer></script>

</head>

<body>

    <header>

        <div class="brand">

            <img src="chitkaralogo.png"

                 alt="Chitkara University logo"

                 class="logo">

            <h1>Campus<span>Connect</span></h1>

        </div>

        <nav>

            <a href="dashboard.html" class="active">Dashboard</a>

            <a href="profile.html" class="profile-btn">Profile</a>

            <a href="#" class="logout-btn" id="logoutBtn">Logout</a>

        </nav>

    </header>

    <main>

        <div class="dashboard-header">

            <h2>Campus Issues</h2>

            <button onclick="window.location.href='create_issue.html'">

                + New Issue

            </button>

        </div>

        <div id="issues-container">

            <p>Loading your issues...</p>

        </div>

    </main>

    <script>

        async function loadIssues() {

            const container = document.getElementById("issues-container");

            const userId = sessionStorage.getItem("user_id");

            // Require a logged-in user

            if (!userId) {

                container.innerHTML =

                    "<p>Please log in to view your issues.</p>";

                return;

            }

            try {

                const response = await fetch(

                    // `http://127.0.0.1:8000/issues?user_id=${encodeURIComponent(userId)}`
                    `https://campusconnect-backend-msmw.onrender.com/issues?user_id=${encodeURIComponent(userId)}`
                    

                );

                if (!response.ok) {

                    throw new Error("Failed to load issues");

                }

                const issues = await response.json();

                container.innerHTML = "";

                if (issues.length === 0) {

                    container.innerHTML = "<p>You haven't created any issues yet.</p>";

                    return;

                }

                issues.forEach(function (issue) {

                    const card = document.createElement("div");

                    card.className = "issue-card";

                    card.onclick = function () {

                        window.location.href =

                            "issue_details.html?id=" + issue.id;

                    };

                    const title = document.createElement("h3");

                    title.textContent = issue.title;

                    const details = document.createElement("p");

                    details.textContent =

                        `${issue.category} - ${issue.location}`;

                    const status = document.createElement("p");

                    status.textContent = `Status: ${issue.status}`;

                    card.appendChild(title);

                    card.appendChild(details);

                    card.appendChild(status);

                    container.appendChild(card);

                });

            } catch (error) {

                container.innerHTML =

                    "<p>Unable to load your issues. Please try again later.</p>";

                console.error(error);

            }

        }

        document.getElementById("logoutBtn").addEventListener("click", function (event) {

            event.preventDefault();

            sessionStorage.removeItem("user_id");

            sessionStorage.removeItem("user_name");

            sessionStorage.removeItem("user_email");

            window.location.href = "login.html";

        });

        loadIssues();

    </script>

</body>

</html>
