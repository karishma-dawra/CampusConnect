<!DOCTYPE html>
<html>

<head>
    <title>CampusConnect Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <header>

        <div class="brand">
            <img src="chitkaralogo.png"
                 alt="Chitkara university logo"
                 class="logo">

            <h1>Campus<span>Connect</span></h1>
        </div>

        <nav>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="profile.html" class="profile-btn">Profile</a>
            <a href="login.html" class="logout-btn">Logout</a>
        </nav>

    </header>

    <main>

        <div class="dashboard-header">

            <h2>Campus Issues</h2>

            <button onclick="window.location.href='create_issue.html'">
                + New Issue
            </button>

        </div>

        <!-- Issues will be loaded from backend -->
        <div id="issues-container">

            <p>Loading issues...</p>

        </div>

    </main>


    <script>

        async function loadIssues() {

            const container = document.getElementById("issues-container");

            try {

                const response = await fetch("/https://campusconnect-0p44.onrender.com");

                if (!response.ok) {
                    throw new Error("Failed to load issues");
                }

                const issues = await response.json();

                container.innerHTML = "";

                if (issues.length === 0) {

                    container.innerHTML =
                        "<p>No issues found.</p>";

                    return;
                }

                issues.forEach(function(issue) {

                    const card = document.createElement("div");

                    card.className = "issue-card";

                    card.onclick = function() {

                        window.location.href =
                            "issue_details.html?id=" + issue.id;

                    };

                    card.innerHTML = `
                        <h3>${issue.title}</h3>

                        <p>
                            <span class="category-badge">
                                ${issue.category}
                            </span>
                            - ${issue.location}
                        </p>

                        <p>
                            Status:
                            <strong>${issue.status}</strong>
                        </p>
                    `;

                    container.appendChild(card);

                });

            } catch (error) {

                container.innerHTML =
                    "<p>Unable to load issues. Please try again later.</p>";

                console.log(error);

            }

        }

        loadIssues();

    </script>

</body>

</html>
