<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CampusConnect</title>
    <link
        rel="icon"
        type="image/png"
        href="https://drive.google.com/thumbnail?id=1FnXdG7aGmNNLgkQSF7leajJrgMWwGhn8&sz=w128"
    >
    <link rel="stylesheet" href="dashboard.css">
    <script src="loader.js" defer></script>
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div class="spinner" id="spinner"></div>
        <img
            id="loader-logo"
            src="https://drive.google.com/thumbnail?id=1P5dhvb-RHJ_f-3v45eattSBf56D5e9yZ&sz=w1000"
            alt="Website Logo"
        >
    </div>
    <!-- End Loader -->
    <header>
        <div class="brand">
            <img
                src="chitkaralogo.png"
                alt="Chitkara University logo"
                class="logo"
            >
            <h1>Campus<span>Connect</span></h1>
        </div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="login.html" class="logout-btn" id="logoutBtn">Logout</a>
        </nav>
    </header>
    <main>
        <h2>My Profile</h2>
        <div class="profile-card" id="profile-container">
            <h3>Student Profile</h3>
            <p>
                <strong>Roll Number:</strong>
                <span id="profile-name">Loading...</span>
            </p>
            <p>
                <strong>Email:</strong>
                <span id="profile-email">Loading...</span>
            </p>
            <p>
                <strong>Role:</strong>
                <span id="profile-role">Student</span>
            </p>
        </div>
    </main>
    <script>
        // Read the same storage used by login.js
        const name = sessionStorage.getItem("user_name");
        const email = sessionStorage.getItem("user_email");
        document.getElementById("profile-name").textContent =
            name || "Not available";
        document.getElementById("profile-email").textContent =
            email || "Not available";
        document.getElementById("profile-role").textContent =
            "Student";
        // Clear the saved login details when logging out
        document.getElementById("logoutBtn").addEventListener("click", function () {
            sessionStorage.removeItem("user_id");
            sessionStorage.removeItem("user_name");
            sessionStorage.removeItem("user_email");
        });
    </script>
</body>
</html>
