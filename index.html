
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1FnXdG7aGmNNLgkQSF7leajJrgMWwGhn8&sz=w128">
    <script src="loader.js" defer></script>
    <meta http-equiv="refresh" content="0; url=login.html">
    <style>
        /* loader start */
#loader {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: white;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 99999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}


#loader-logo {
    display: none;
    width: 120px;
    height: 120px;
    object-fit: contain;
}


.spinner {
    width: 45px;
    height: 45px;
    border: 5px solid #eee;
    border-top: 5px solid #dc2626;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}


@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


#loader-logo.pulse {
    display: block;
    animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(0.85);
    }

    50% {
        transform: scale(1.1);
    }
}


#loader.logo-ready .spinner {
    display: none;
}


#loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* loader end */

    </style>
    
</head>
<body>
    <!-- loader start-->


<div id="loader">

   
    <div class="spinner" id="spinner"></div>
    <img
        id="loader-logo"
        src="https://drive.google.com/thumbnail?id=1P5dhvb-RHJ_f-3v45eattSBf56D5e9yZ&sz=w1000"
        alt="Website Logo">

</div>

<!-- loader end -->
</body>
</html>
