<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1FnXdG7aGmNNLgkQSF7leajJrgMWwGhn8&sz=w128">
    <link rel="stylesheet" href="style_adv.css">
    <script src="loader.js" defer></script>
    <script src="login.js" defer></script>
</head>

<body>

<!-- loader start-->


<div id="loader">

   
    <div class="spinner" id="spinner"></div>
    <img
        id="loader-logo"
        src="https://drive.google.com/thumbnail?id=1P5dhvb-RHJ_f-3v45eattSBf56D5e9yZ&sz=w1000"
        alt="Website Logo">

</div>

<!-- loader end -->

    <div class="background">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
    </div>


    <main class="login-container">

        <div class="brand">
            <div class="logo"></div>
            <h1>Campus<span>Connect</span></h1>
            <p>Connect. Collaborate. Grow.</p>
        </div>

        <div class="login-card">

            <div class="card-header">
                <h2>Welcome Back</h2>
                <p>Sign in to continue to your account</p>
            </div>

            <form>

                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username"  inputmode="numeric"  pattern="[0-9]{10}"  maxlength="10"  placeholder="Enter Roll Number" required>
                </div>

                <div class="input-group">
                    <div class="password-label">
                        <label for="password">Password</label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>


                <button type="submit">
                    Sign In
                    <span>→</span>
                </button>

            </form>

            <p class="register">
                Don't have an account?  <a href="register.html">Create an account</a>
            </p>

        </div>

    
    </main>

</body>
</html>
