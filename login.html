<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1FnXdG7aGmNNLgkQSF7leajJrgMWwGhn8&sz=w128">
    <link rel="stylesheet" href="style_adv.css">
</head>

<body>
    <div class="background">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
    </div>


    <main class="login-container">

        <div class="brand">
            <div class="logo"></div>
            <h1>Campus<span>Connect</span></h1>
            <p>Connect. Collaborate. Grow.</p>
        </div>

        <div class="login-card">

            <div class="card-header">
                <h2>Welcome Back</h2>
                <p>Sign in to continue to your account</p>
            </div>

            <form>

                <div class="input-group">
                    <label for="roll_no">Username</label>
                    <input type="text" id="roll_no"inputmode="numeric" pattern="\d{10}" maxlength="10"  placeholder="Enter Roll Number" required>
                </div>

                <div class="input-group">
                    <div class="password-label">
                        <label for="password">Password</label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>


                <button type="submit" onclick="window.location.href='dashboard.html'">
                    Sign In
                    <span>→</span>
                </button>

            </form>

            <p class="register">
                Don't have an account?  <a href="register.html">Create an account</a>
            </p>

        </div>

        

    </main>
</body>
</html>
